name: JsxposedX 硬核编译流水线

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 Android APK
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取源码 (包含 LFS 二进制库)
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        lfs: true 

    - name: 2. 部署 Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 3. 部署 Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: 4. 获取 Flutter 依赖包
      run: flutter pub get

    - name: 5. 启动编译 (指定 Flavor 绕过 Flutter 寻址 Bug)
      run: flutter build apk --flavor api100 --debug

    - name: 6. 🌟 大牛黑客指令：无视报错，暴力提取所有 APK 🌟
      uses: actions/upload-artifact@v4
      if: always() # 关键指令：即使上一步报错，也强制执行这一步！
      with:
        name: JsxposedX-Hbp-Modified
        path: build/app/outputs/**/*.apk  # 宽泛匹配，把所有犄角旮旯的 apk 全抽出来
