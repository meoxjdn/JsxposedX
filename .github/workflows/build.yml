name: JsxposedX 硬核编译流水线

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 Android APK
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取大牛修改版的源码
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: 2. 部署 Java JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 3. 部署 Flutter SDK 引擎
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: 4. 获取项目依赖包 (Dart/Flutter)
      run: flutter pub get

    - name: 5. 🌟 大牛黑客指令：替换阿里云为三大国际官方源 🌟
      run: find . -name "*.gradle*" -type f -exec sed -i 's/.*aliyun.*/google(); mavenCentral(); gradlePluginPortal();/g' {} +

    - name: 6. 赋予 Gradle 执行权限
      run: chmod +x gradlew
      working-directory: android

    - name: 7. 启动原生 Gradle 编译 (直捣黄龙)
      run: ./gradlew assembleDebug --info --stacktrace
      working-directory: android

    - name: 8. 提取并上传最终产物 (APK)
      uses: actions/upload-artifact@v4
      with:
        name: JsxposedX-Hbp-Modified
        path: android/app/build/outputs/apk/debug/*.apk
