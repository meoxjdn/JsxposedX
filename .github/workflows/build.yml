name: JsxposedX 硬核编译流水线

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 Android APK
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取源码
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: 2. 部署 Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 3. 部署 Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: 4. 获取 Flutter 依赖包
      run: flutter pub get

    - name: 5. 启动标准 Flutter 编译 (拨乱反正)
      run: flutter build apk --debug -v

    - name: 6. 上传 APK 产物
      uses: actions/upload-artifact@v4
      with:
        name: JsxposedX-Hbp-Modified
        path: build/app/outputs/flutter-apk/app-debug.apk
